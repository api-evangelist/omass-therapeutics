name: OMass Therapeutics
description: 'OMass Therapeutics is an Oxford, UK biotechnology company developing
  medicines for immunological and rare diseases. It harnesses proprietary biochemistry,
  native mass spectrometry and custom chemistry through its OdyssION drug discovery
  platform to interrogate drug targets and how they interact with their native
  biological ecosystem, separate from the confounding complexity of the cell. The
  company operates a corporate and scientific web presence (science, pipeline, publications,
  news and blog) and, as a therapeutics company, publishes no public developer or
  API surface. Backed by GV and other life-sciences investors.'
